<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="430" fill="#ffffff"/>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24483e"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a27">Ciclo de uma atividade, do plano ao documento</text>
  <g font-size="13" fill="#1f2a27">
    <!-- linha 1 -->
    <rect x="20" y="60" width="170" height="70" rx="10" fill="#eef3ea" stroke="#24483e"/>
    <text x="105" y="88" text-anchor="middle" font-weight="bold">1. Plano</text>
    <text x="105" y="106" text-anchor="middle">docs/plans/&lt;ID&gt;.md</text>
    <text x="105" y="122" text-anchor="middle" font-size="11">blocos 4 e 5 antes do código</text>

    <rect x="225" y="60" width="170" height="70" rx="10" fill="#eef3ea" stroke="#24483e"/>
    <text x="310" y="88" text-anchor="middle" font-weight="bold">2. Branch</text>
    <text x="310" y="106" text-anchor="middle">feat/ fix/ docs/ + ID</text>
    <text x="310" y="122" text-anchor="middle" font-size="11">uma por atividade</text>

    <rect x="430" y="60" width="170" height="70" rx="10" fill="#eef3ea" stroke="#24483e"/>
    <text x="515" y="88" text-anchor="middle" font-weight="bold">3. Implementação</text>
    <text x="515" y="106" text-anchor="middle">código + testes do tipo</text>
    <text x="515" y="122" text-anchor="middle" font-size="11">tags @RF no código e no teste</text>

    <rect x="635" y="60" width="170" height="70" rx="10" fill="#eef3ea" stroke="#24483e"/>
    <text x="720" y="88" text-anchor="middle" font-weight="bold">4. Verificação local</text>
    <text x="720" y="106" text-anchor="middle">npm run verify</text>
    <text x="720" y="122" text-anchor="middle" font-size="11">lint, tipos, testes, build</text>

    <rect x="840" y="60" width="140" height="70" rx="10" fill="#eef3ea" stroke="#24483e"/>
    <text x="910" y="88" text-anchor="middle" font-weight="bold">5. Pull request</text>
    <text x="910" y="106" text-anchor="middle">critérios do</text>
    <text x="910" y="122" text-anchor="middle">bloco 5 colados</text>

    <!-- linha 2 (direita para esquerda) -->
    <rect x="770" y="200" width="210" height="90" rx="10" fill="#fff7e6" stroke="#b45309"/>
    <text x="875" y="226" text-anchor="middle" font-weight="bold">6. Integração contínua</text>
    <text x="875" y="246" text-anchor="middle" font-size="12">lint · tipos · testes · cobertura</text>
    <text x="875" y="263" text-anchor="middle" font-size="12">rastreabilidade · build</text>
    <text x="875" y="280" text-anchor="middle" font-size="12">E2E em 4 partes · RLS</text>

    <rect x="525" y="210" width="190" height="70" rx="10" fill="#eef3ea" stroke="#24483e"/>
    <text x="620" y="238" text-anchor="middle" font-weight="bold">7. Revisão</text>
    <text x="620" y="256" text-anchor="middle">Fernando confere</text>
    <text x="620" y="272" text-anchor="middle" font-size="11">o bloco 5 e a segurança</text>

    <rect x="300" y="210" width="170" height="70" rx="10" fill="#24483e" stroke="#24483e"/>
    <text x="385" y="240" text-anchor="middle" font-weight="bold" fill="#ffffff">8. Merge na main</text>
    <text x="385" y="260" text-anchor="middle" fill="#ffffff" font-size="12">só com CI verde</text>

    <rect x="20" y="210" width="220" height="70" rx="10" fill="#eef3ea" stroke="#24483e"/>
    <text x="130" y="238" text-anchor="middle" font-weight="bold">9. Documento</text>
    <text x="130" y="256" text-anchor="middle">seções tocadas e</text>
    <text x="130" y="272" text-anchor="middle" font-size="11">linha na Parte 00</text>

    <!-- Notion -->
    <rect x="300" y="345" width="400" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="6 4"/>
    <text x="500" y="370" text-anchor="middle" font-weight="bold">Quadro no Notion (espelho de status)</text>
    <text x="500" y="389" text-anchor="middle" font-size="12">atualizado por notion.yml a cada PR aberto ou fechado</text>
  </g>
  <g stroke="#24483e" stroke-width="2" fill="none">
    <line x1="190" y1="95" x2="222" y2="95" marker-end="url(#s)"/>
    <line x1="395" y1="95" x2="427" y2="95" marker-end="url(#s)"/>
    <line x1="600" y1="95" x2="632" y2="95" marker-end="url(#s)"/>
    <line x1="805" y1="95" x2="837" y2="95" marker-end="url(#s)"/>
    <line x1="910" y1="130" x2="910" y2="197" marker-end="url(#s)"/>
    <line x1="770" y1="245" x2="718" y2="245" marker-end="url(#s)"/>
    <line x1="525" y1="245" x2="473" y2="245" marker-end="url(#s)"/>
    <line x1="300" y1="245" x2="243" y2="245" marker-end="url(#s)"/>
  </g>
  <!-- volta: CI vermelho ou ajustes solicitados -->
  <path d="M 820 200 C 760 160, 600 160, 530 132" stroke="#b45309" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#v)"/>
  <text x="690" y="150" text-anchor="middle" font-size="12" fill="#b45309">falhou ou ajustes solicitados: volta à implementação</text>
  <g stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M 980 110 L 992 110 L 992 375 L 700 375"/>
    <line x1="385" y1="280" x2="420" y2="345"/>
  </g>
</svg>
