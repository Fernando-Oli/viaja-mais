<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a27"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2a27">Sequência de uma escrita: membro adiciona atividade ao itinerário</text>
  <g font-size="13" font-weight="bold" fill="#1f2a27" text-anchor="middle">
    <rect x="30"  y="50" width="150" height="44" rx="8" fill="#eef3ea" stroke="#24483e"/><text x="105" y="70">Tela (navegador)</text><text x="105" y="86" font-size="10.5" font-weight="normal">itinerary/new</text>
    <rect x="230" y="50" width="160" height="44" rx="8" fill="#eef3ea" stroke="#24483e"/><text x="310" y="70">Route handler</text><text x="310" y="86" font-size="10.5" font-weight="normal">POST /api/trips/[id]/itinerary</text>
    <rect x="440" y="50" width="150" height="44" rx="8" fill="#eef3ea" stroke="#24483e"/><text x="515" y="70">Supabase Auth</text><text x="515" y="86" font-size="10.5" font-weight="normal">getUser()</text>
    <rect x="640" y="50" width="150" height="44" rx="8" fill="#eef3ea" stroke="#24483e"/><text x="715" y="70">lib/authz/trip.ts</text><text x="715" y="86" font-size="10.5" font-weight="normal">exigirMembro()</text>
    <rect x="830" y="50" width="150" height="44" rx="8" fill="#eef3ea" stroke="#24483e"/><text x="905" y="70">Postgres + RLS</text><text x="905" y="86" font-size="10.5" font-weight="normal">itinerary_items</text>
  </g>
  <g stroke="#9ca3af" stroke-dasharray="5 5"><line x1="105" y1="94" x2="105" y2="540"/><line x1="310" y1="94" x2="310" y2="540"/><line x1="515" y1="94" x2="515" y2="540"/><line x1="715" y1="94" x2="715" y2="540"/><line x1="905" y1="94" x2="905" y2="540"/></g>
  <g font-size="12" fill="#1f2a27" stroke-width="1.6">
    <line x1="105" y1="130" x2="306" y2="130" stroke="#1f2a27" marker-end="url(#a)"/><text x="205" y="123" text-anchor="middle">1. fetch com o formulário (JSON)</text>
    <line x1="310" y1="170" x2="511" y2="170" stroke="#1f2a27" marker-end="url(#a)"/><text x="410" y="163" text-anchor="middle">2. quem é a sessão?</text>
    <line x1="310" y1="200" x2="106" y2="200" stroke="#b91c1c" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="205" y="194" text-anchor="middle" fill="#b91c1c">sem sessão: 401</text>
    <line x1="310" y1="240" x2="711" y2="240" stroke="#1f2a27" marker-end="url(#a)"/><text x="510" y="233" text-anchor="middle">3. é membro desta viagem?</text>
    <line x1="310" y1="270" x2="106" y2="270" stroke="#b91c1c" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="205" y="264" text-anchor="middle" fill="#b91c1c">não é membro: 403</text>
    <rect x="300" y="290" width="20" height="40" fill="#fff7e6" stroke="#b45309"/>
    <text x="330" y="306">4. schema.parse(body) com zod:</text>
    <text x="330" y="322">só os campos previstos; trip_id vem da URL</text>
    <line x1="310" y1="350" x2="106" y2="350" stroke="#b91c1c" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="205" y="344" text-anchor="middle" fill="#b91c1c">dados inválidos: 400</text>
    <line x1="310" y1="395" x2="901" y2="395" stroke="#1f2a27" marker-end="url(#a)"/><text x="610" y="388" text-anchor="middle">5. insert campo a campo, com o cliente da sessão</text>
    <rect x="895" y="405" width="20" height="40" fill="#fff7e6" stroke="#b45309"/>
    <text x="885" y="425" text-anchor="end">6. a RLS confere de novo (segunda linha)</text>
    <line x1="905" y1="465" x2="314" y2="465" stroke="#1f2a27" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="610" y="458" text-anchor="middle">linha gravada</text>
    <line x1="310" y1="505" x2="109" y2="505" stroke="#1f2a27" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="205" y="498" text-anchor="middle">7. 200: toast e volta ao detalhe</text>
  </g>
</svg>
