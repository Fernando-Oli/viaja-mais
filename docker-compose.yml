# Ambiente local do Avori, sem Supabase.
#
#   docker compose up -d --wait     sobe tudo e espera ficar saudável
#   npm run db:reset                recria o banco do zero: migrations + seed
#
# Banco, e-mail e armazenamento de arquivos. A API roda fora do compose em
# desenvolvimento (`npm run api:dev`).
#
# Portas escolhidas para não colidir com o Supabase local (54321-54324), que
# continua instalado na máquina de quem ainda trabalha na `main`.
name: avori

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: postgres
      # Senhas de desenvolvimento local. Nunca as mesmas de um ambiente real.
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:-postgres}
      POSTGRES_DB: avori
      APP_API_SENHA: ${APP_API_SENHA:-app_api_local}
      APP_AUTH_SENHA: ${APP_AUTH_SENHA:-app_auth_local}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements
      - -c
      - cron.database_name=avori
      # Sessão ociosa dentro de transação segura uma conexão do pool e os locks
      # dela. Em desenvolvimento isso aparece como teste travado sem motivo.
      - -c
      - idle_in_transaction_session_timeout=60s
    ports:
      - "55432:5432"
    volumes:
      - dados-db:/var/lib/postgresql/data
    healthcheck:
      # Por TCP, não pelo socket. Durante os scripts de db/init o Postgres sobe
      # um servidor temporário só no socket; checando pelo socket, o serviço
      # ficava "saudável" antes de o banco existir e a migration falhava.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d avori"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Recebe todo e-mail enviado em desenvolvimento (cadastro, recuperação de
    # senha, convite). Nada sai da máquina. Interface em http://localhost:58025.
    image: axllent/mailpit:v1.33.1
    ports:
      - "58025:8025"
      - "51025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  armazenamento:
    # Armazenamento de arquivos compatível com S3, só para desenvolvimento: em
    # produção as fotos vão para o S3 da AWS, e a API fala com os dois pelo
    # mesmo SDK (docs/plans/S13-F-foto-s3.md). O MinIO comunitário, que o plano
    # previa, deixou de publicar imagem em 2025.
    #
    # Gateway S3 em http://localhost:58333, com as chaves de
    # armazenamento/s3.json. O bucket é criado pela própria API na primeira
    # foto (só fora de produção).
    image: chrislusf/seaweedfs:4.52
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -volume.max=10
      - -master.volumeSizeLimitMB=64
    ports:
      - "58333:8333"
    volumes:
      - dados-armazenamento:/data
      - ./armazenamento/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dados-db:
  dados-armazenamento:
