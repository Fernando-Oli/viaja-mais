name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # O build embute as variáveis NEXT_PUBLIC_* no bundle do navegador, então elas
  # precisam existir aqui. Usamos os secrets quando houver e caem para
  # placeholders quando não — o artefato do CI não é publicado, só verificamos
  # que o build compila.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || 'placeholder-maps-key' }}

jobs:
  verify:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # O teto de avisos do `lint` é o baseline da dívida herdada: ele só pode
      # cair. Um PR que introduz aviso novo estoura o teto e falha aqui.
      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm run test -- --reporter=verbose

      # Requisito "Implementado" sem teste, ou tag que não existe no catálogo,
      # falha aqui. Só confere: a matriz versionada é regenerada na `main`.
      - name: Rastreabilidade
        run: npm run pfc:rastreabilidade:check

      - name: Cobertura
        run: npm run test:cov
        continue-on-error: true

      - name: Arquivar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 30

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # PR que só mexe em documentação (docs/ e arquivos .md) não muda nenhuma
  # tela: o E2E é pulado. Os outros jobs rodam sempre — a rastreabilidade, por
  # exemplo, lê o catálogo que mora em docs/.
  mudancas:
    name: O que mudou
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.diff.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Só documentação mudou: E2E pulado."
          fi

  # E2E contra um Supabase local efêmero, o mesmo stack do job "Migrations e
  # RLS": migrations + seed aplicados do zero, usuários teste.a/teste.b do seed.
  #
  # Antes este job dependia de secrets E2E_USER_* que nunca foram configurados,
  # e caía num `echo "E2E pulado"` — ficava verde em 50 s sem executar teste
  # nenhum, de setembro a 11/11/2026.
  #
  # A suíte é dividida em 4 partes que rodam em paralelo, cada uma com o seu
  # próprio Supabase: os testes compartilham os usuários do seed e por isso
  # rodam um de cada vez dentro de um banco (workers: 1), mas bancos separados
  # não disputam nada. Em série eram ~15 min; em 4 partes, ~6.
  e2e:
    name: Playwright (${{ matrix.parte }}/4)
    runs-on: ubuntu-latest
    needs: mudancas
    if: ${{ needs.mudancas.outputs.codigo == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false) }}
    timeout-minutes: 30
    strategy:
      # Uma parte falhando não cancela as outras: o relatório mostra tudo.
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Mesma versão fixa do db.yml e das máquinas da equipe.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0

      - name: Subir o Supabase local
        run: supabase start

      # Nomes do próprio CLI (API_URL, ANON_KEY, ...). Eles são repassados com os
      # nomes da aplicação no `env:` de cada passo, porque o `env:` do topo do
      # workflow (os placeholders) tem precedência sobre o $GITHUB_ENV.
      - name: Exportar credenciais do stack
        run: |
          supabase status -o env 2>/dev/null \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' | sed 's/"//g' >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium

      - name: Build contra o stack local
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: E2E
        run: npm run e2e -- --shard=${{ matrix.parte }}/4
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ env.DB_URL }}

      - name: Arquivar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.parte }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
