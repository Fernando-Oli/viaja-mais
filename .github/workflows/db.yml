name: Banco de dados

on:
  pull_request:
    paths: ["db/**", "api/**", "tests/rls/**", "tests/integracao/**", "docker-compose.yml", ".github/workflows/db.yml"]
  push:
    branches: [main]
    paths: ["db/**", "api/**", "tests/rls/**", "tests/integracao/**", "docker-compose.yml"]

jobs:
  migrations:
    name: Migrations, RLS e integração
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `db:reset` recria o banco do zero: o Postgres roda db/init/ (papéis,
      # schemas, tabelas do Better Auth), e o script aplica db/migrations/ e
      # db/seed.sql. É a prova de que o banco é reproduzível **só a partir do
      # repositório**, que foi o que faltou no início do projeto.
      - name: Subir os serviços e recriar o banco
        run: |
          docker compose up --detach --wait mailpit armazenamento
          npm run db:reset

      # tests/rls: a RLS com dois usuários, pelo papel e a identidade de cada
      # um. tests/integracao: a API inteira (sessão, banco, e-mail e S3 reais).
      - name: Testes de RLS e de integração
        run: npm run test:rls
