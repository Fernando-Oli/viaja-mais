name: Banco de dados

on:
  pull_request:
    paths: ["supabase/**", "tests/rls/**", ".github/workflows/db.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", "tests/rls/**"]

jobs:
  migrations:
    name: Migrations e RLS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Stack real do Supabase, e não `services: postgres`, porque o schema
      # versionado é um dump do projeto hospedado: depende de pg_graphql,
      # supabase_vault, do schema `auth` e dos roles anon/authenticated/
      # service_role. Nada disso existe num Postgres puro — foi exatamente
      # assim que este job quebrou quando a primeira migration entrou.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` aplica supabase/migrations/ e roda supabase/seed.sql.
      # É a prova de que o banco é reproduzível **só a partir do repositório**,
      # que foi o que faltou no início do projeto, quando o schema existia
      # apenas dentro do painel do Supabase.
      - name: Subir o Supabase local
        run: supabase start

      # Os testes de isolamento logam de verdade pelo GoTrue, então precisam da
      # URL da API e da chave anon deste stack efêmero. O `-o env` sai com
      # aspas e manda ruído para o stderr; filtramos as duas coisas.
      - name: Exportar credenciais do stack
        run: |
          supabase status -o env 2>/dev/null \
            | grep -E '^[A-Z0-9_]+=' | sed 's/"//g' >> "$GITHUB_ENV"
          echo "DATABASE_URL=$(supabase status -o env 2>/dev/null \
            | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"

      - name: Testes de RLS
        run: npm run test:rls
